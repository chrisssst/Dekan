version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rustcrypto:
        patterns: ['sha2', 'digest', 'chacha20poly1305', 'aead']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /relay-worker
    schedule:
      interval: monthly
    groups:
      relay:
        patterns: ['*']
