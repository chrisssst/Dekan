version: 2
updates:
  # Pinned action SHAs only stay current if something bumps them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Only version bumps of existing crates; a new dependency still needs a written justification.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # RustCrypto crates share `hybrid-array`/`crypto-common`: a major bump of one only builds together
      # with the others, so they arrive in a single PR (majors included).
      rustcrypto:
        patterns: ['sha2', 'digest', 'chacha20poly1305', 'aead']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /relay-worker
    schedule:
      interval: monthly
    groups:
      relay:
        patterns: ['*']
