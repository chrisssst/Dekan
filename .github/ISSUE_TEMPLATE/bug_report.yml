name: Bug report
description: Something does not work as expected. Please attach the log.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **A bug without a log usually cannot be diagnosed.**
        Logs are in `%LOCALAPPDATA%\Dekan\logs`. For more detail, set `DEKAN_LOG=debug`, reproduce, and attach the newest file.
        Security issues go to a [private advisory](https://github.com/chrisssst/Dekan/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Dekan version
      description: Explorer → dekan.exe → Properties → Details → Product version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Draft / Ranked
        - Blind pick
        - ARAM
        - Swiftplay
        - Arena
        - Rotating mode (URF, etc.)
        - Classic Rift
        - Reconnect
        - Not in a match (startup, tray, installer)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Skin did not load
        - Game crashed or opened the repair screen
        - Selection window
        - Custom mods
        - Party mode
        - Installer / uninstaller
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Champion and skin help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the log file here, or paste the relevant lines.
      render: text
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am running Dekan without "Run as administrator".
          required: true
        - label: I searched existing issues and did not find this one.
          required: true
