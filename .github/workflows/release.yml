name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and existing releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "dekan-app") | .version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version $version"; exit 1; }
          display_version="${version%.0}"
          tag="v$display_version"
          echo "version=$display_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags "https://github.com/$REPO" "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build installer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build the release binary (cargo xtask package)
        run: cargo xtask package

      - id: unsigned-exe
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-dekan-exe-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/dekan.exe

      - name: Sign dekan.exe (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Build installer around that binary (cargo xtask installer --prebuilt)
        run: cargo xtask installer --prebuilt

      - id: unsigned-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-setup-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/installer

      - name: Verify the Authenticode signatures
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($file in @('dist/dekan.exe', "dist/installer/Dekan-Setup-$env:VERSION-x64.exe")) {
            $signature = Get-AuthenticodeSignature $file
            "{0}: {1} {2}" -f $file, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed" }
          }

      - name: Checksums
        shell: pwsh
        run: |
          $name = "Dekan-Setup-$env:VERSION-x64.exe"
          $hash = (Get-FileHash "dist/installer/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Set-Content -NoNewline -Encoding ascii dist/installer/SHA256SUMS
          Get-Content dist/installer/SHA256SUMS

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe

      - name: Attach the provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE "dist/installer/Dekan-Setup-$env:VERSION-x64.exe.sigstore.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekan-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe
            dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe.sigstore.json
            dist/installer/SHA256SUMS

  publish:
    name: Publish pre-release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" out/*.exe out/*.sigstore.json out/SHA256SUMS \
            --target "$SHA" --prerelease --generate-notes --title "Dekan $TAG"
