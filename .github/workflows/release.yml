name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Next version from the last release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git tag --points-at "$SHA" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            echo "$SHA is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          latest=${latest:-v0.0}
          IFS=. read -r major minor _ <<<"${latest#v}"
          breaking=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | index("breaking") != null')
          if [[ "$breaking" == true ]]; then
            next="$((major + 1)).0"
          else
            next="$major.$((minor + 1))"
          fi
          floor=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "dekan-app") | .version' | cut -d. -f1,2)
          [[ "$floor" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::bad workspace version $floor"; exit 1; }
          version=$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -n 1)
          tag="v$version"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; raise the workspace version or remove the stale tag"
            exit 1
          fi
          echo "Releasing $tag (previous $latest, breaking=$breaking, floor $floor)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build installer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Stamp the release version (cargo xtask set-version)
        run: cargo xtask set-version "$env:VERSION"

      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build the release binary (cargo xtask package)
        run: cargo xtask package

      - id: unsigned-exe
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-dekan-exe-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/dekan.exe

      - name: Sign dekan.exe (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Build installer around that binary (cargo xtask installer --prebuilt)
        run: cargo xtask installer --prebuilt

      - id: unsigned-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-setup-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/installer

      - name: Verify the Authenticode signatures
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($file in @('dist/dekan.exe', "dist/installer/Dekan-Setup-$env:VERSION-x64.exe")) {
            $signature = Get-AuthenticodeSignature $file
            "{0}: {1} {2}" -f $file, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed" }
          }

      - name: Checksums
        shell: pwsh
        run: |
          $name = "Dekan-Setup-$env:VERSION-x64.exe"
          $hash = (Get-FileHash "dist/installer/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Set-Content -NoNewline -Encoding ascii dist/installer/SHA256SUMS
          Get-Content dist/installer/SHA256SUMS

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe

      - name: Attach the provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE "dist/installer/Dekan-Setup-$env:VERSION-x64.exe.sigstore.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekan-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe
            dist/installer/Dekan-Setup-${{ env.VERSION }}-x64.exe.sigstore.json
            dist/installer/SHA256SUMS

  publish:
    name: Publish pre-release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" out/*.exe out/*.sigstore.json out/SHA256SUMS \
            --target "$SHA" --prerelease --generate-notes --title "Dekan $TAG"
