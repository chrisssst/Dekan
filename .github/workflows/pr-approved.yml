name: PR approved

# First half of the auto-merge flow. A review event on a pull request from a fork only gets a
# read-only token, so this workflow does nothing privileged: it records which pull request and which
# commit were approved. `automerge.yml` picks that up in the base repository's context, re-checks
# everything through the API and never runs code from the pull request.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  record:
    name: Record approval
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write approval record
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir approval
          printf '%s\n' "$PR_NUMBER" > approval/pr
          printf '%s\n' "$HEAD_SHA" > approval/sha

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approval
          path: approval/
          retention-days: 1
