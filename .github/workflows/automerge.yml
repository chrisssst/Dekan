name: Auto-merge

# Second half of the auto-merge flow. Runs in the base repository after `PR approved` finished, with a
# GitHub App token: merges made with the default GITHUB_TOKEN do not trigger other workflows, and the
# release pipeline has to run after the merge.
#
# This workflow only ENABLES auto-merge. GitHub performs the merge later, and only once every check
# the `main` ruleset requires has passed on the exact approved commit. An approval can therefore never
# merge red code, a commit pushed after the approval, or a change to a protected path.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no PR code is checked out or executed; the artifact is validated as untrusted input
    workflows: [PR approved]
    types: [completed]

permissions: {}

jobs:
  enable:
    name: Enable auto-merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approval
          path: approval
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact was written by a workflow that may have run for a fork: treat it as untrusted.
      - name: Validate approval record
        id: record
        run: |
          pr=$(head -c 16 approval/pr | tr -d '\r\n')
          sha=$(head -c 64 approval/sha | tr -d '\r\n')
          [[ "$pr" =~ ^[0-9]{1,7}$ ]] || { echo "::error::invalid PR number"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit sha"; exit 1; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEKAN_BOT_APP_ID }}
          private-key: ${{ secrets.DEKAN_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check the pull request is eligible
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.record.outputs.pr }}
          SHA: ${{ steps.record.outputs.sha }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          state=$(jq -r .state <<<"$pr_json")
          base=$(jq -r .base.ref <<<"$pr_json")
          head=$(jq -r .head.sha <<<"$pr_json")
          draft=$(jq -r .draft <<<"$pr_json")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")

          [[ "$state" == open ]] || { echo "PR #$PR is $state; nothing to do"; exit 0; }
          [[ "$base" == main ]] || { echo "::error::PR #$PR targets $base, not main"; exit 1; }
          [[ "$draft" == false ]] || { echo "::error::PR #$PR is a draft"; exit 1; }
          [[ "$head" == "$SHA" ]] || { echo "::error::PR #$PR changed after the approval ($SHA -> $head); a new approval is required"; exit 1; }
          [[ ",$labels," != *",no-automerge,"* ]] || { echo "PR #$PR is labelled no-automerge"; exit 0; }

          # The latest review of every reviewer counts; the approval must come from someone with
          # write access, and nobody may still be requesting changes.
          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" | jq -s 'add
            | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user.login) | map(max_by(.submitted_at))')
          if jq -e 'any(.[]; .state == "CHANGES_REQUESTED")' <<<"$reviews" >/dev/null; then
            echo "::error::PR #$PR still has changes requested"; exit 1
          fi
          approved=false
          for user in $(jq -r '.[] | select(.state == "APPROVED" and .commit_id == env.SHA) | .user.login' <<<"$reviews"); do
            perm=$(gh api "repos/$REPO/collaborators/$user/permission" --jq .permission)
            if [[ "$perm" == admin || "$perm" == maintain || "$perm" == write ]]; then approved=true; fi
          done
          [[ "$approved" == true ]] || { echo "::error::no approval of $SHA from a maintainer"; exit 1; }

          # Safety net for a wrong approval: changes to what decides trust, permissions or what ships
          # never merge automatically. A maintainer merges those by hand, as a second deliberate act.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          protected='^(\.github/|installer/|\.cargo/|rust-toolchain\.toml$|deny\.toml$|\.gitleaks\.toml$|clippy\.toml$|Cargo\.lock$|crates/dekan-app/build\.rs$|crates/dekan-app/src/trigger\.rs$|crates/dekan-inject/src/(ltk_host|dll_validator|suspend)\.rs$|crates/dekan-party/src/(crypto|token)\.rs$|relay-worker/wrangler\.toml$|xtask/)'
          blocked=$(grep -E "$protected" <<<"$files" || true)
          if [[ -n "$blocked" ]]; then
            echo "::warning::PR #$PR touches protected paths and must be merged by hand:"
            echo "$blocked"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_ENV"

      - name: Enable auto-merge (squash)
        if: env.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.record.outputs.pr }}
          SHA: ${{ steps.record.outputs.sha }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$SHA"
