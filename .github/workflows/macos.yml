name: macOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOS_TARGET: aarch64-apple-darwin

jobs:
  portable:
    name: Portable crates on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup target add "$MACOS_TARGET"

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --locked --target "$MACOS_TARGET" -p dekan-core -p dekan-wad -p dekan-classic -p dekan-party -p dekan-relay -p dekan-lcu

      - name: Test
        run: cargo test --locked --target "$MACOS_TARGET" -p dekan-core -p dekan-wad -p dekan-classic -p dekan-party -p dekan-relay
