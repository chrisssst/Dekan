name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > $null

      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

  release-build:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Release binary as shipped (cargo xtask package)
        run: cargo xtask package

      - name: Executable metadata and manifest
        shell: pwsh
        run: |
          $exe = 'dist/dekan.exe'
          $info = (Get-Item $exe).VersionInfo
          $expected = @{ ProductName = 'Dekan'; CompanyName = 'Dekan'; OriginalFilename = 'dekan.exe' }
          foreach ($key in $expected.Keys) {
            if ($info.$key -ne $expected[$key]) { Write-Error "$key is '$($info.$key)', expected '$($expected[$key])'"; exit 1 }
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notmatch 'requestedExecutionLevel level="asInvoker"') { Write-Error 'asInvoker manifest missing'; exit 1 }
          if ($text -match 'requireAdministrator') { Write-Error 'the executable requests elevation'; exit 1 }
          if ($text -match 'VCRUNTIME140') { Write-Error 'the C runtime is not linked statically'; exit 1 }
          if ($text.Contains($env:USERPROFILE) -or $text.Contains($env:GITHUB_WORKSPACE)) { Write-Error 'build machine paths are embedded'; exit 1 }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe + 24 + 64) -eq 0) { Write-Error 'the PE checksum is not set'; exit 1 }
          Write-Output "OK: $($info.ProductName) $($info.ProductVersion) by $($info.CompanyName), runs as invoker"

  deny:
    name: Dependencies (advisories, licenses, bans, sources)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny check

  relay-worker:
    name: Relay worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  workflow-lint:
    name: Workflow lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium --format plain .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [check, release-build, deny, relay-worker, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed"
