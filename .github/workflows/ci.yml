name: CI

on:
  # Every branch push and every pull request, not only main: a build handed to testers must pass the
  # same gate before it reaches them, not only once it lands on main.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain comes from rust-toolchain.toml, the same file every local build reads, so CI
      # and a developer machine cannot drift apart. rustup is preinstalled on the runner.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A PR that changes Cargo.toml without updating Cargo.lock would build with versions nobody
      # reviewed.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > $null

      # Error-handling sweep, rustfmt, clippy -D warnings, the whole test suite.
      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

  # The release profile (LTO, static CRT, embedded resources) is what users run. A debug-only gate
  # would miss a broken build script or a missing manifest.
  release-build:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: cargo build --release --locked
        run: cargo build --release --locked -p dekan-app

      # The file details and the asInvoker manifest come from build.rs; an exe without them would
      # look anonymous in Explorer and could prompt for elevation.
      - name: Executable metadata and manifest
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/dekan.exe'
          $info = (Get-Item $exe).VersionInfo
          $expected = @{ ProductName = 'Dekan'; CompanyName = 'Dekan'; OriginalFilename = 'dekan.exe' }
          foreach ($key in $expected.Keys) {
            if ($info.$key -ne $expected[$key]) { Write-Error "$key is '$($info.$key)', expected '$($expected[$key])'"; exit 1 }
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notmatch 'requestedExecutionLevel level="asInvoker"') { Write-Error 'asInvoker manifest missing'; exit 1 }
          if ($text -match 'requireAdministrator') { Write-Error 'the executable requests elevation'; exit 1 }
          Write-Output "OK: $($info.ProductName) $($info.ProductVersion) by $($info.CompanyName), runs as invoker"

  deny:
    name: Dependencies (advisories, licenses, bans, sources)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny check

  # The public party relay is TypeScript on Cloudflare Workers; a type error there breaks party mode
  # for every user without touching a single Rust line.
  relay-worker:
    name: Relay worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  # Workflows run with repository permissions, so they get the same review as code: syntax and
  # expression errors (actionlint) and security mistakes such as template injection, unpinned
  # actions or leaked credentials (zizmor).
  workflow-lint:
    name: Workflow lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium --format plain .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # One stable name for branch protection to require, whatever jobs are added above.
  ci-ok:
    name: CI OK
    if: always()
    needs: [check, release-build, deny, relay-worker, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed"
