# Categories for the automatically generated release notes.
changelog:
  exclude:
    labels: [ignore-for-release]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
