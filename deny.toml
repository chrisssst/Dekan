[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-build"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-testing"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-common"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-software"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
unmaintained = "workspace"
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
