<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Dekan</title>
    <style>
      :root {
        --bg-0: #05080c;
        --bg-1: #0a1428;
        --bg-2: #0e1c2e;
        --panel: #10161f;
        --card: #141c28;
        --card-hover: #1a2436;
        --line: #243040;
        --line-gold: #4a3d22;
        --gold: #c8aa6e;
        --gold-bright: #f0e6d2;
        --gold-dim: #785a28;
        --cyan: #0ac8b9;
        --text: #f0e6d2;
        --muted: #a09b8c;
        --muted-dim: #5b5a56;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: radial-gradient(120% 140% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 80%);
        color: var(--text);
        font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      /* The window is resizable: header and footer stay put, the card takes the rest and scrolls
         when the text does not fit, so the button is never pushed out of view. */
      body {
        display: flex;
        flex-direction: column;
        padding: clamp(14px, 4vh, 22px) clamp(16px, 5vw, 28px) clamp(14px, 4vh, 24px);
        animation: fadeIn 0.25s ease-out both;
      }

      .header,
      .footer {
        flex: none;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line-gold);
        padding-bottom: 14px;
        position: relative;
      }

      .header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
        opacity: 0.6;
      }

      .logo {
        width: 38px;
        height: 38px;
        flex: none;
        filter: drop-shadow(0 0 6px rgba(200, 170, 110, 0.4));
      }

      .header-info {
        display: flex;
        flex-direction: column;
      }

      .title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--gold-bright);
        line-height: 1.15;
      }

      .version-tag {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--gold);
        opacity: 0.85;
        vertical-align: middle;
        margin-left: 6px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-top: 2px;
      }

      .card {
        background: linear-gradient(180deg, rgba(26, 36, 52, 0.7) 0%, rgba(16, 22, 31, 0.9) 100%);
        border: 1px solid var(--line);
        border-left: 2px solid var(--gold);
        border-radius: 8px;
        padding: 16px 20px;
        margin: 14px 0;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 3px 10px 3px 6px;
        border-radius: 999px;
        background: rgba(10, 200, 185, 0.08);
        border: 1px solid rgba(10, 200, 185, 0.25);
        color: var(--cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        margin-bottom: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 6px var(--cyan);
        animation: pulse 2s ease-in-out infinite;
      }

      .features {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .features li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: #d8e2ec;
        font-size: 12.5px;
        line-height: 1.4;
      }

      .features .dekan {
        color: var(--gold);
        font-size: 10px;
        line-height: 1.7;
        flex: none;
      }

      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card::-webkit-scrollbar {
        width: 8px;
      }
      .card::-webkit-scrollbar-thumb {
        background: var(--line-gold);
        border-radius: 4px;
      }

      .btn-dismiss {
        width: min(230px, 100%);
        height: 40px;
        border-radius: 6px;
        background: linear-gradient(180deg, #1f2b3c 0%, #121a25 100%);
        border: 1px solid var(--gold);
        color: var(--gold-bright);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        cursor: pointer;
        outline: none;
        box-shadow: 0 0 10px rgba(200, 170, 110, 0.15), inset 0 0 0 1px rgba(200, 170, 110, 0.2);
        transition: all 0.15s ease;
      }

      .btn-dismiss:hover {
        background: linear-gradient(180deg, #2a3a50 0%, #172230 100%);
        border-color: #f0e6d2;
        box-shadow: 0 0 16px rgba(200, 170, 110, 0.35), inset 0 0 0 1px rgba(240, 230, 210, 0.4);
        transform: translateY(-1px);
      }

      .btn-dismiss:active {
        transform: translateY(1px);
        box-shadow: 0 0 6px rgba(200, 170, 110, 0.2);
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.85);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 40 40" width="38" height="38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="#c8aa6e" stroke-width="2" fill="#141c28"/>
          <circle cx="20" cy="20" r="14" stroke="#785a28" stroke-width="1" stroke-dasharray="3 3"/>
          <path d="M20 7L24 15H16L20 7Z" fill="#f0e6d2"/>
          <rect x="18" y="15" width="4" height="13" rx="2" fill="#c8aa6e"/>
          <circle cx="20" cy="21" r="3" fill="#0ac8b9"/>
        </svg>
      </div>
      <div class="header-info">
        <span class="title">DEKAN <span class="version-tag">v{{version}}</span></span>
        <span class="subtitle">League of Legends Skin Changer</span>
      </div>
    </div>

    <div class="card">
      <div class="status-pill">
        <span class="dot"></span>
        {{welcome_active}}
      </div>
      <ul class="features">
        <li>
          <span class="dekan">&#9670;</span>
          <span>{{welcome_background}}</span>
        </li>
        <li>
          <span class="dekan">&#9670;</span>
          <span>{{welcome_author}}</span>
        </li>
        {{welcome_tray_hint_item}}
        {{welcome_quote_item}}
      </ul>
    </div>

    <div class="footer">
      <button class="btn-dismiss" id="dismissBtn">{{welcome_dismiss}}</button>
    </div>

    <script>
      document.getElementById("dismissBtn").addEventListener("click", () => {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage("dismiss");
        }
      });
    </script>
  </body>
</html>
