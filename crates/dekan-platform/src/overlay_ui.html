<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Dekan</title>
    <style>
      :root {
        --bg-0: #05080c;
        --bg-1: #0a1428;
        --bg-2: #0e1c2e;
        --panel: #10161f;
        --card: #1a2230;
        --card-hover: #202a3b;
        --line: #2a3542;
        --line-gold: #4a3d22;
        --gold: #c8aa6e;
        --gold-bright: #f0e6d2;
        --gold-dim: #785a28;
        --cyan: #0ac8b9;
        --text: #f0e6d2;
        --muted: #a09b8c;
        --muted-dim: #5b5a56;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: radial-gradient(120% 140% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 70%);
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        border-radius: 14px;
      }

      header {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--panel) 100%);
        border-bottom: 1px solid var(--line-gold);
        border-radius: 14px 14px 0 0;
        cursor: grab;
        user-select: none;
      }

      header:active {
        cursor: grabbing;
      }

      .win-btn {
        margin-left: 4px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .win-btn:hover {
        color: var(--gold-bright);
        background: rgba(200, 170, 110, 0.2);
      }

      header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
        opacity: 0.6;
      }

      .logo {
        width: 26px;
        height: 26px;
        flex: none;
        filter: drop-shadow(0 0 3px rgba(200, 170, 110, 0.35));
      }

      .title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--gold-bright);
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .version-tag {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--gold);
        opacity: 0.85;
      }

      .champion {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 3px;
        border: 1px solid var(--line-gold);
        border-radius: 999px;
        background: rgba(200, 170, 110, 0.08);
        max-width: 160px;
      }

      .champion-portrait {
        width: 22px;
        height: 22px;
        flex: none;
        border-radius: 50%;
        object-fit: cover;
        background: var(--bg-0);
        box-shadow: 0 0 0 1px var(--gold-dim);
      }

      .champion-portrait.placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold-dim);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 11px;
      }

      .champion-name {
        color: var(--gold);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search {
        padding: 8px 14px 6px;
        flex: none;
      }

      .search .box {
        position: relative;
      }

      .search input {
        width: 100%;
        padding: 9px 11px 9px 30px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg-0);
        color: var(--text);
        font: inherit;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .search .glyph {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-dim);
        font-size: 13px;
        pointer-events: none;
      }

      .search input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(200, 170, 110, 0.15);
      }

      .search input::placeholder {
        color: var(--muted-dim);
      }

      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 12px 14px;
      }

      main::-webkit-scrollbar {
        width: 8px;
      }
      main::-webkit-scrollbar-track {
        background: transparent;
      }
      main::-webkit-scrollbar-thumb {
        background: var(--line-gold);
        border-radius: 4px;
      }
      main::-webkit-scrollbar-thumb:hover {
        background: var(--gold-dim);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .skin {
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-left: 2px solid var(--line);
        border-radius: 3px;
        background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
        padding: 9px 11px;
        cursor: pointer;
        clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%);
        transition: border-color 0.12s, background 0.12s, transform 0.08s;
      }

      .skin.enter {
        animation: rise 0.16s ease both;
      }

      .skin:hover {
        border-color: var(--gold-dim);
        border-left-color: var(--gold);
        background: linear-gradient(180deg, var(--card-hover) 0%, var(--panel) 100%);
      }

      .skin.selected {
        border-color: var(--gold);
        border-left-color: var(--gold);
        background: linear-gradient(180deg, rgba(200, 170, 110, 0.16) 0%, var(--card) 100%);
        box-shadow: inset 0 0 0 1px rgba(200, 170, 110, 0.35), 0 0 12px rgba(200, 170, 110, 0.12);
      }

      .skin.selected::before {
        content: "\2713";
        position: absolute;
        top: 7px;
        right: 10px;
        color: var(--gold);
        font-size: 11px;
        font-weight: 700;
      }

      .skin .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-right: 16px;
      }

      .thumb {
        width: 56px;
        height: 56px;
        flex: none;
        border-radius: 6px;
        border: 1px solid var(--line);
        object-fit: cover;
        background: var(--bg-0);
      }

      .thumb.placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, var(--card-hover) 0%, var(--bg-0) 100%);
        color: var(--gold-dim);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 22px;
      }

      .skin.selected .thumb {
        border-color: var(--gold);
      }

      .info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        flex: 1;
      }

      .skin .name {
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .historic-tag {
        display: none;
        align-self: flex-start;
        padding: 1px 6px;
        border: 1px solid var(--gold-dim);
        border-radius: 3px;
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .chroma.form .chroma-gem {
        border-radius: 1px;
        transform: rotate(45deg) scale(0.8);
        background: var(--gold-dim) !important;
      }

      .skin.historic .historic-tag,
      .skin.random .random-tag {
        display: inline-block;
      }

      .random-tag {
        display: none;
        align-self: flex-start;
        padding: 1px 6px;
        border: 1px solid var(--gold-dim);
        border-radius: 3px;
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .search .box {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .dice {
        flex: none;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        color: var(--gold);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .dice:hover {
        border-color: var(--gold-dim);
      }

      .skin .name.unknown {
        color: var(--muted);
        font-style: italic;
      }

      .chromas {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .chroma {
        position: relative;
        width: 18px;
        height: 19px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-color: var(--line);
        clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        transition: transform 0.15s ease, background-color 0.15s ease;
        flex: none;
      }

      .chroma-gem {
        position: absolute;
        inset: 2px;
        clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        pointer-events: none;
      }

      .chroma:hover {
        transform: translateY(-2px) scale(1.12);
        background-color: var(--gold-dim);
      }

      .chroma.selected {
        background-color: var(--gold);
        transform: scale(1.22);
        z-index: 2;
      }

      .chroma.selected::after {
        content: "✓";
        position: absolute;
        font-size: 10px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 1px 2px #000, 0 0 3px #000;
        z-index: 3;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .notice {
        margin: 8px 12px 0;
        padding: 8px 10px;
        border: 1px solid var(--gold-dim);
        border-left: 3px solid var(--gold);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        line-height: 1.4;
      }

      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        gap: 8px;
        padding: 24px 20px;
        text-align: center;
        color: var(--muted);
      }

      .empty .mark {
        width: 40px;
        height: 40px;
        opacity: 0.28;
        margin-bottom: 4px;
      }

      .empty .big {
        color: var(--gold-bright);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .empty .sub {
        font-size: 12px;
        max-width: 240px;
      }

      footer {
        flex: none;
        padding: 8px 14px;
        border-top: 1px solid var(--line-gold);
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 0 0 14px 14px;
        gap: 10px;
      }

      #footerRight {
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: right;
      }

      #footerRight.quote {
        font-style: italic;
        color: var(--gold-bright);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 5px var(--cyan);
        animation: pulse 2s ease-in-out infinite;
      }

      .dot.offline {
        background: var(--muted-dim);
        box-shadow: none;
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 0 14px 6px;
        flex: none;
      }

      .tab {
        flex: 1;
        padding: 6px 0;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .tab:hover {
        border-color: var(--gold-dim);
        color: var(--text);
      }

      .tab.active {
        border-color: var(--gold);
        color: var(--gold-bright);
        background: rgba(200, 170, 110, 0.12);
      }

      .tab .count {
        color: var(--gold);
        margin-left: 5px;
        font-variant-numeric: tabular-nums;
      }

      .mods {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .mod-section h3 {
        margin: 4px 0 6px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
      }

      .mod-section h4 {
        margin: 8px 0 5px;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }

      .mod {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 10px;
        margin-bottom: 5px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--line);
        border-radius: 3px;
        background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
      }

      .mod:hover {
        border-color: var(--gold-dim);
        border-left-color: var(--gold);
      }

      .mod.selected {
        border-color: var(--gold);
        border-left-color: var(--gold);
        background: linear-gradient(180deg, rgba(200, 170, 110, 0.16) 0%, var(--card) 100%);
      }

      .mod .tick {
        width: 13px;
        height: 13px;
        flex: none;
        border: 1px solid var(--gold-dim);
        background: var(--bg-0);
      }

      .mod .tick.radio {
        border-radius: 50%;
      }

      .mod.selected .tick {
        background: var(--gold);
        box-shadow: inset 0 0 0 3px var(--bg-0);
      }

      .mod .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mod .label.none {
        color: var(--muted);
        font-style: italic;
      }

      .mod-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }

      .mod-empty .big {
        color: var(--gold-bright);
        font-size: 13px;
        font-weight: 600;
      }

      .mod-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        padding-top: 4px;
      }

      .mod-actions select {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
      }

      .btn {
        padding: 7px 12px;
        border: 1px solid var(--gold-dim);
        border-radius: 3px;
        background: var(--panel);
        color: var(--gold-bright);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--gold);
      }

      @media (min-width: 560px) {
        .list {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
      }

      .resize-grip {
        position: fixed;
        right: 5px;
        bottom: 5px;
        width: 12px;
        height: 12px;
        z-index: 10;
        cursor: nwse-resize;
        opacity: 0.7;
        background: linear-gradient(
          135deg,
          transparent 45%,
          var(--gold-dim) 45%,
          var(--gold-dim) 55%,
          transparent 55%,
          transparent 70%,
          var(--gold-dim) 70%,
          var(--gold-dim) 80%,
          transparent 80%
        );
      }

      .resize-grip:hover {
        opacity: 1;
      }

      #footerRight {
        margin-right: 12px;
      }

      .chroma-preview {
        position: fixed;
        z-index: 20;
        width: 148px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 1px solid var(--gold-dim);
        border-radius: 6px;
        background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        animation: rise 0.12s ease both;
      }

      .chroma-preview img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        border-radius: 4px;
        background: radial-gradient(circle at 50% 40%, var(--card-hover) 0%, var(--bg-0) 75%);
      }

      .chroma-preview.loading img {
        opacity: 0.35;
      }

      .chroma-preview .preview-name {
        color: var(--gold-bright);
        font-size: 11px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>

    <script>
      (function () {
        const el = (id) => document.getElementById(id);
        let catalog = { championName: "", skins: [] };
        let selectedId = null;
        let selectionOrigin = null;
        let tab = "skins";

        const EMPTY_MODS = { skin: [], map: [], font: [], announcer: [], others: [] };
        const EMPTY_SELECTION = { skin: null, map: null, font: null, announcer: null, others: [] };
        let mods = { available: EMPTY_MODS, selection: EMPTY_SELECTION };
        const OTHER_CATEGORIES = ["ui", "voiceover", "loadingScreen", "vfx", "sfx", "other"];
        let lastImportCategory = "skin";

        function post(message) {
          if (window.ipc && typeof window.ipc.postMessage === "function") {
            window.ipc.postMessage(JSON.stringify(message));
          }
        }

        function normalizeText(str) {
          return (str || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
        }

        function normalizeSelection(view) {
          const v = view || {};
          return {
            skin: v.skin || null,
            map: v.map || null,
            font: v.font || null,
            announcer: v.announcer || null,
            others: Array.isArray(v.others) ? v.others.slice() : [],
          };
        }

        function normalizeAvailable(available) {
          const a = available || {};
          const list = (x) => (Array.isArray(x) ? x : []);
          return {
            skin: list(a.skin),
            map: list(a.map),
            font: list(a.font),
            announcer: list(a.announcer),
            others: list(a.others),
          };
        }

        function selectedModCount() {
          const sel = mods.selection;
          return (
            (sel.skin ? 1 : 0) +
            (sel.map ? 1 : 0) +
            (sel.font ? 1 : 0) +
            (sel.announcer ? 1 : 0) +
            sel.others.length
          );
        }

        function updateTabs() {
          el("tabSkins").classList.toggle("active", tab === "skins");
          el("tabMods").classList.toggle("active", tab === "mods");
          el("tabSkins").textContent = t().tabSkins;
          el("tabMods").firstChild.textContent = t().tabMods;
          const count = selectedModCount();
          el("modsCount").textContent = count ? String(count) : "";
          el("search").placeholder =
            tab === "mods" ? t().searchModsPlaceholder : t().searchPlaceholder;
        }

        function modRow(entry, slot, selected, radio) {
          const row = document.createElement("div");
          row.className = "mod" + (selected ? " selected" : "");
          row.dataset.slot = slot;
          row.dataset.id = entry ? entry.id : "";
          const tick = document.createElement("span");
          tick.className = "tick" + (radio ? " radio" : "");
          const label = document.createElement("span");
          label.className = "label" + (entry ? "" : " none");
          label.textContent = entry ? entry.name : t().none;
          if (entry && entry.description) row.title = entry.description;
          row.append(tick, label);
          return row;
        }

        function renderMods(rawTerm) {
          const root = el("mods");
          root.textContent = "";
          const a = mods.available;
          const sel = mods.selection;
          const term = normalizeText(rawTerm);
          const matches = (m) =>
            !term ||
            normalizeText(m.name).includes(term) ||
            (m.description && normalizeText(m.description).includes(term));
          const total =
            a.skin.length + a.map.length + a.font.length + a.announcer.length + a.others.length;

          if (total === 0) {
            const box = document.createElement("div");
            box.className = "mod-empty";
            const big = document.createElement("div");
            big.className = "big";
            big.textContent = t().noModsBig;
            const sub = document.createElement("div");
            sub.textContent = t().noModsSub;
            box.append(big, sub);
            root.append(box);
          }

          let shown = 0;
          const singles = [
            ["skin", t().slotSkin],
            ["map", t().slotMap],
            ["font", t().slotFont],
            ["announcer", t().slotAnnouncer],
          ];
          for (const [slot, title] of singles) {
            const entries = a[slot].filter(matches);
            if (!entries.length) continue;
            const section = document.createElement("div");
            section.className = "mod-section";
            const h = document.createElement("h3");
            h.textContent = title;
            section.append(h, modRow(null, slot, !sel[slot], true));
            for (const entry of entries) {
              section.append(modRow(entry, slot, sel[slot] === entry.id, true));
            }
            root.append(section);
            shown += entries.length;
          }

          const others = a.others.filter(matches);
          if (others.length) {
            const section = document.createElement("div");
            section.className = "mod-section";
            const h = document.createElement("h3");
            h.textContent = t().slotOthers;
            section.append(h);
            for (const category of OTHER_CATEGORIES) {
              const group = others.filter((m) => m.category === category);
              if (!group.length) continue;
              const sub = document.createElement("h4");
              sub.textContent = t().categories[category] || category;
              section.append(sub);
              for (const entry of group) {
                section.append(modRow(entry, "others", sel.others.includes(entry.id), false));
              }
            }
            root.append(section);
            shown += others.length;
          }

          if (total > 0 && shown === 0 && term) {
            const box = document.createElement("div");
            box.className = "mod-empty";
            box.textContent = t().noModsMatch(rawTerm);
            root.append(box);
          }

          const actions = document.createElement("div");
          actions.className = "mod-actions";
          const category = document.createElement("select");
          category.id = "importCategory";
          const choices = [
            ["skin", t().slotSkin],
            ["map", t().slotMap],
            ["font", t().slotFont],
            ["announcer", t().slotAnnouncer],
          ].concat(OTHER_CATEGORIES.map((c) => [c, t().categories[c] || c]));
          for (const [value, label] of choices) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            category.append(option);
          }
          category.value = lastImportCategory;
          const importButton = document.createElement("button");
          importButton.type = "button";
          importButton.className = "btn";
          importButton.id = "importMod";
          importButton.textContent = t().importMod;
          const open = document.createElement("button");
          open.type = "button";
          open.className = "btn";
          open.id = "openModsFolder";
          open.textContent = t().openFolder;
          actions.append(category, importButton, open);
          root.append(actions);
        }

        const STRINGS = {
          tr_TR: {
            searchPlaceholder: "Skin ara…",
            noChampion: "şampiyon yok",
            historicTag: "son kullanılan · temizlemek için tıkla",
            randomTag: "rastgele seçildi · temizlemek için tıkla",
            diceTitle: "Rastgele skin seç",
            waitingBig: "Şampiyon seçimi bekleniyor",
            waitingSub: "Bir şampiyon kilitlendiğinde skin kataloğu burada görünür.",
            noResultsBig: "Skin bulunamadı",
            noResultsSub: (term) => "Kütüphanede “" + term + "” ile eşleşen skin yok.",
            noLibraryBig: (champ) => champ + " için kütüphanede skin yok",
            noLibrarySub: "Bu şampiyon için kütüphanenize bir skin paketi ekleyin.",
            connected: "istemciye bağlı",
            skinCount: (n) => n + " skin",
            tabSkins: "Skinler",
            tabMods: "Modlar",
            searchModsPlaceholder: "Mod ara…",
            slotSkin: "Skin modu",
            slotMap: "Harita",
            slotFont: "Yazı tipi",
            slotAnnouncer: "Spiker",
            slotOthers: "Diğer",
            none: "Yok",
            openFolder: "Mod klasörünü aç",
            importMod: "Mod içe aktar…",
            noModsBig: "Mod bulunamadı",
            noModsSub: "Modları (META/info.json içeren klasör veya .fantome/.zip) Dekan'ın mod klasörüne ekleyin.",
            noModsMatch: (term) => "“" + term + "” ile eşleşen mod yok.",
            notices: {
              toolsMissing:
                "Enjeksiyon araçları eksik: burada seçtiğiniz hiçbir şey uygulanmayacak. Sistem tepsisindeki Dekan simgesinden “Araçlar klasörünü aç” seçeneğini kullanın.",
            },
            categories: {
              ui: "Arayüz",
              voiceover: "Seslendirme",
              loadingScreen: "Yükleme ekranı",
              vfx: "Görsel efektler",
              sfx: "Ses efektleri",
              other: "Diğer",
            },
          },
          en_US: {
            searchPlaceholder: "Search skin…",
            noChampion: "no champion",
            historicTag: "last used · click to clear",
            randomTag: "rolled · click to clear",
            diceTitle: "Roll a random skin",
            waitingBig: "Waiting for champion select",
            waitingSub: "The skin catalog appears here as soon as a champion is locked in.",
            noResultsBig: "No skin found",
            noResultsSub: (term) => "No skin in the library matches “" + term + "”.",
            noLibraryBig: (champ) => "No skin in the library for " + champ,
            noLibrarySub: "Add a skin package for this champion to your library.",
            connected: "connected to client",
            skinCount: (n) => n + (n === 1 ? " skin" : " skins"),
            tabSkins: "Skins",
            tabMods: "Mods",
            searchModsPlaceholder: "Search mod…",
            slotSkin: "Skin mod",
            slotMap: "Map",
            slotFont: "Font",
            slotAnnouncer: "Announcer",
            slotOthers: "Others",
            none: "None",
            openFolder: "Open mods folder",
            importMod: "Import mod…",
            noModsBig: "No mod found",
            noModsSub: "Put mods (a folder with META/info.json, or a .fantome/.zip) in Dekan's mods folder.",
            noModsMatch: (term) => "No mod matches “" + term + "”.",
            notices: {
              toolsMissing:
                "Injection tools are missing: nothing picked here will be applied. Use “Open tools folder” on Dekan's tray icon.",
            },
            categories: {
              ui: "Interface",
              voiceover: "Voice-over",
              loadingScreen: "Loading screen",
              vfx: "Visual effects",
              sfx: "Sound effects",
              other: "Others",
            },
          },
        };
        let locale = "tr_TR";
        const t = () => STRINGS[locale] || STRINGS.tr_TR;

        function setLocale(clientLocale) {
          const language = String(clientLocale || "").split("_")[0].toLowerCase();
          const family = Object.keys(STRINGS).find((key) => key.split("_")[0] === language);
          locale = STRINGS[clientLocale] ? clientLocale : family || "tr_TR";
          updateTabs();
        }

        function championLabel() {
          const name = catalog.championName || "";
          return name && catalog.classic ? name + " " + t().classicSuffix : name;
        }

        function updateNotice() {
          const node = el("notice");
          const text = catalog.notice && t().notices[catalog.notice];
          node.hidden = !text;
          node.textContent = text || "";
        }

        function card(skin, index, animate) {
          const node = document.createElement("div");
          const isSelected =
            selectedId === skin.id || (skin.chromas || []).some((c) => c.id === selectedId);
          node.className = "skin" + (isSelected ? " selected" : "");
          node.dataset.id = String(skin.id);
          if (animate) {
            node.classList.add("enter");
            node.style.animationDelay = Math.min(index * 12, 160) + "ms";
          }

          const row = document.createElement("div");
          row.className = "row";

          let thumb;
          if (skin.tile) {
            thumb = document.createElement("img");
            thumb.className = "thumb";
            thumb.alt = "";
            thumb.src = skin.tile;
          } else {
            thumb = document.createElement("div");
            thumb.className = "thumb placeholder";
            thumb.textContent = (skin.name || "?").trim().charAt(0).toUpperCase();
          }

          const info = document.createElement("div");
          info.className = "info";

          const name = document.createElement("span");
          name.className = "name" + (skin.nameUnknown ? " unknown" : "");
          name.textContent = skin.name;
          info.append(name);

          const tag = document.createElement("span");
          tag.className = "historic-tag";
          tag.textContent = t().historicTag;
          const rolled = document.createElement("span");
          rolled.className = "random-tag";
          rolled.textContent = t().randomTag;
          info.append(tag, rolled);

          if (skin.chromas && skin.chromas.length) {
            const chromas = document.createElement("div");
            chromas.className = "chromas";
            for (const chroma of skin.chromas) {
              const dot = document.createElement("span");
              dot.className =
                "chroma" + (chroma.form ? " form" : "") + (selectedId === chroma.id ? " selected" : "");
              dot.dataset.id = String(chroma.id);
              dot.dataset.name = chroma.name;
              if (chroma.hasPreview) dot.dataset.preview = "1";
              else dot.title = chroma.name;
              const gem = document.createElement("span");
              gem.className = "chroma-gem";
              gem.style.background = chroma.color || "#3a4a5a";
              dot.append(gem);
              chromas.append(dot);
            }
            info.append(chromas);
          }

          row.append(thumb, info);
          node.append(row);
          return node;
        }

        function updateChampionPortrait() {
          const portrait = el("championPortrait");
          const withTile = (catalog.skins || []).find((s) => s.tile);
          if (withTile) {
            const img = document.createElement("img");
            img.className = "champion-portrait";
            img.alt = "";
            img.src = withTile.tile;
            portrait.replaceWith(img);
            img.id = "championPortrait";
          } else if (portrait.tagName !== "DIV") {
            const div = document.createElement("div");
            div.className = "champion-portrait placeholder";
            div.id = "championPortrait";
            div.textContent = (catalog.championName || "?").trim().charAt(0).toUpperCase();
            portrait.replaceWith(div);
          } else {
            portrait.textContent = (catalog.championName || "?").trim().charAt(0).toUpperCase();
          }
        }

        function updateFooterRight() {
          const node = el("footerRight");
          if (catalog.quote && locale === "tr_TR") {
            node.textContent = "“" + catalog.quote + "”";
            node.classList.add("quote");
          } else {
            const total = (catalog.skins || []).reduce((n, s) => n + 1 + (s.chromas || []).length, 0);
            node.textContent = t().skinCount(total);
            node.classList.remove("quote");
          }
        }

        function render(animate) {
          const list = el("list");
          const empty = el("empty");
          const rawTerm = el("search").value.trim();
          const term = normalizeText(rawTerm);

          updateTabs();
          updateNotice();
          el("mods").hidden = tab !== "mods";
          if (tab === "mods") {
            list.hidden = true;
            empty.hidden = true;
            renderMods(rawTerm);
            updateFooterRight();
            el("championName").textContent = championLabel() || t().noChampion;
            updateChampionPortrait();
            return;
          }

          const skins = (catalog.skins || []).filter(
            (s) =>
              !term ||
              normalizeText(s.name).includes(term) ||
              String(s.id).includes(term) ||
              (s.chromas || []).some((c) => normalizeText(c.name).includes(term)),
          );

          list.textContent = "";
          skins.forEach((skin, index) => list.append(card(skin, index, animate)));

          updateFooterRight();
          el("championName").textContent = championLabel() || t().noChampion;
          updateChampionPortrait();

          const nothing = skins.length === 0;
          empty.hidden = !nothing;
          list.hidden = nothing;

          const big = empty.querySelector(".big");
          const sub = empty.querySelector(".sub");
          if (nothing && rawTerm) {
            big.textContent = t().noResultsBig;
            sub.textContent = t().noResultsSub(rawTerm);
          } else if (nothing && catalog.championName) {
            big.textContent = t().noLibraryBig(championLabel());
            sub.textContent = t().noLibrarySub;
          } else {
            big.textContent = t().waitingBig;
            sub.textContent = t().waitingSub;
          }
        }

        function updateSelection() {
          for (const node of el("list").querySelectorAll(".skin")) {
            const chromaMatch = !!node.querySelector('.chroma[data-id="' + selectedId + '"]');
            const selected = Number(node.dataset.id) === selectedId || chromaMatch;
            node.classList.toggle("selected", selected);
            node.classList.toggle("historic", selected && selectionOrigin === "historic");
            node.classList.toggle("random", selected && selectionOrigin === "random");
          }
          for (const node of el("list").querySelectorAll(".chroma")) {
            node.classList.toggle("selected", Number(node.dataset.id) === selectedId);
          }
        }

        function choose(id) {
          const clearing = selectedId === id;
          selectedId = clearing ? null : id;
          selectionOrigin = null;
          updateSelection();
          post(clearing ? { type: "clear" } : { type: "select", id });
        }

        el("list").addEventListener("click", (event) => {
          const chroma = event.target.closest(".chroma");
          if (chroma) {
            event.stopPropagation();
            choose(Number(chroma.dataset.id));
            return;
          }
          const skin = event.target.closest(".skin");
          if (skin) choose(Number(skin.dataset.id));
        });

        const searchInput = el("search");
        const requestFocus = () => {
          if (!document.hasFocus()) post({ type: "focus" });
        };
        searchInput.addEventListener("focus", requestFocus);
        searchInput.addEventListener("pointerdown", requestFocus);
        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape" || e.key === "Enter") {
            searchInput.blur();
            post({ type: "blur" });
          }
        });
        searchInput.addEventListener("input", () => render(false));

        el("dice").addEventListener("click", () => post({ type: "random" }));

        for (const button of [el("tabSkins"), el("tabMods")]) {
          button.addEventListener("click", () => {
            if (tab === button.dataset.tab) return;
            tab = button.dataset.tab;
            el("search").value = "";
            document.querySelector("main").scrollTop = 0;
            render(tab === "skins");
          });
        }

        el("mods").addEventListener("click", (event) => {
          if (event.target.closest("#openModsFolder")) {
            post({ type: "openModsFolder" });
            return;
          }
          if (event.target.closest("#importMod")) {
            lastImportCategory = el("importCategory").value;
            post({ type: "importMod", category: lastImportCategory });
            return;
          }
          if (event.target.closest("#importCategory")) return;
          const row = event.target.closest(".mod");
          if (!row) return;
          const slot = row.dataset.slot;
          const id = row.dataset.id || null;
          const next = normalizeSelection(mods.selection);
          if (slot === "others") {
            if (!id) return;
            next.others = next.others.includes(id)
              ? next.others.filter((x) => x !== id)
              : next.others.concat([id]);
          } else {
            next[slot] = id;
          }
          mods.selection = next;
          render(false);
          post({ type: "setMods", selection: next });
        });

        const preview = el("chromaPreview");
        const previewImg = el("chromaPreviewImg");
        const previewCache = new Map();
        let previewFor = null;
        let previewAnchor = null;

        function placePreview(anchor) {
          const r = anchor.getBoundingClientRect();
          const pw = preview.offsetWidth;
          const ph = preview.offsetHeight;
          const left = Math.max(6, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 6));
          let top = r.top - ph - 8;
          if (top < 6) top = r.bottom + 8;
          top = Math.max(6, Math.min(top, window.innerHeight - ph - 6));
          preview.style.left = left + "px";
          preview.style.top = top + "px";
        }

        function showPreview(dot) {
          const id = Number(dot.dataset.id);
          previewFor = id;
          previewAnchor = dot;
          el("chromaPreviewName").textContent = dot.dataset.name || "";
          const uri = previewCache.get(id);
          if (uri) {
            previewImg.src = uri;
            preview.classList.remove("loading");
          } else {
            previewImg.removeAttribute("src");
            preview.classList.add("loading");
            post({ type: "chromaPreview", id });
          }
          preview.hidden = false;
          placePreview(dot);
        }

        function hidePreview() {
          previewFor = null;
          previewAnchor = null;
          preview.hidden = true;
        }

        el("list").addEventListener("mouseover", (event) => {
          const dot = event.target.closest(".chroma");
          if (!dot || dot.dataset.preview !== "1") return;
          if (Number(dot.dataset.id) !== previewFor) showPreview(dot);
        });
        el("list").addEventListener("mouseout", (event) => {
          const dot = event.target.closest(".chroma");
          if (dot && !dot.contains(event.relatedTarget)) hidePreview();
        });
        document.querySelector("main").addEventListener("scroll", hidePreview, { passive: true });

        el("resizeGrip").addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          hidePreview();
          post({ type: "resize" });
        });

        window.dekanOverlay = {
          setChromaPreview(id, uri) {
            if (typeof id !== "number" || typeof uri !== "string" || !uri.startsWith("data:image/")) return;
            previewCache.set(id, uri);
            if (previewFor === id) {
              previewImg.src = uri;
              preview.classList.remove("loading");
              if (previewAnchor) placePreview(previewAnchor);
            }
          },
          setSelection(id, origin) {
            selectedId = typeof id === "number" ? id : null;
            selectionOrigin = selectedId !== null && typeof origin === "string" ? origin : null;
            updateSelection();
          },
          setMods(panel) {
            mods = {
              available: normalizeAvailable(panel && panel.available),
              selection: normalizeSelection(panel && panel.selection),
            };
            render(false);
          },
          setModSelection(view) {
            mods.selection = normalizeSelection(view);
            render(false);
          },
          setCatalog(next) {
            catalog = next || { championName: "", skins: [] };
            mods = {
              available: normalizeAvailable(catalog.mods && catalog.mods.available),
              selection: normalizeSelection(catalog.mods && catalog.mods.selection),
            };
            selectedId = null;
            selectionOrigin = null;
            previewCache.clear();
            hidePreview();
            el("search").value = "";
            document.querySelector("main").scrollTop = 0;
            if (catalog.locale) setLocale(catalog.locale);
            render(true);
          },
        };

        const overlayHeader = el("overlayHeader") || document.querySelector("header");
        if (overlayHeader) {
          overlayHeader.addEventListener("mousedown", (e) => {
            if (e.button !== 0 || e.target.closest("button") || e.target.closest("input")) return;
            window.ipc.postMessage(JSON.stringify({ type: "drag" }));
          });
        }

        const btnClose = el("btnClose");
        if (btnClose) {
          btnClose.addEventListener("click", (e) => {
            e.stopPropagation();
            window.ipc.postMessage(JSON.stringify({ type: "hide" }));
          });
        }
      })();
    </script>
  </body>
</html>
